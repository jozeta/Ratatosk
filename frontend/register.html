<!doctype html>
<html lang="en" data-accent="slate-steel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratatosk - Register</title>
<link rel="stylesheet" href="/static/css/app.css" integrity="sha384-YetmR1azM/OlNBUGGGv1MKgZtyC1WcP/ovrT7LEul6zowoFeQF0lXLeo9qdpRg2x">
<link rel="stylesheet" href="/static/vendor/lada-glass/1.1.0/lada-glass.css" integrity="sha384-F9z2HVYMp/rZQizpuzs26hcCLsceneof0ipKZKBRX5Vocywh3SRfkEelQNYwgFvH">
<link rel="stylesheet" href="/static/css/lada.css" integrity="sha384-CdF0mzlZQ5/Ht70387qrB+k3/Vmz7RsH0agFwaYVl1lGoZmXgVHLHKIoMZZFMVge">
</head>
<body>

<div id="sd-navbar" class="navbar"></div>

<main class="container-narrow" style="padding-top:32px; padding-bottom:32px">
  <div class="card" style="max-width:400px; margin:0 auto" id="registerDisabledNotice" hidden>
    <h2 class="mt-0">Registration is closed</h2>
    <p class="text-muted small mb-0">This instance isn't accepting new sign-ups right now. If you need an account, ask an admin to create one for you.</p>
    <p class="small text-muted mt-2 mb-0">Already have an account? <a href="/login">Log in</a></p>
  </div>

  <div class="card" style="max-width:400px; margin:0 auto" id="registerFormCard">
    <h2 class="mt-0">Create an account</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" maxlength="64" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="email">Email <span class="text-muted">(optional)</span><span class="info-icon" tabindex="0">i<span class="info-tooltip">Only used so you can reset your password later if you forget it. Leave it blank if you'd rather not provide one.</span></span></label>
        <input type="email" id="email" maxlength="254" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password">
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="flex justify-between items-center mt-1">
          <span class="small text-muted" id="strengthLabel"></span>
        </div>
        <ul class="policy-checklist" id="policyChecklist"></ul>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Register</button>
    </form>
    <p class="small text-muted mt-2">Already have an account? <a href="/login">Log in</a></p>
  </div>
</main>

<footer class="app-footer" id="sd-footer"></footer>

<script src="/static/js/theme.js" integrity="sha384-nHvWqFZ1BnneONoX6ZPhrl4VABFF8xIUWBwbhH3cUOnUSiE3adAxGv7hWS2t52O0"></script>
<script src="/static/js/api.js" integrity="sha384-Y9cUFpIQmvkj2Dod0H9JG7V5GxpTGFAbTZhJLHozPr7aj5lVBXYv/vTl5aw/Wecd"></script>
<script src="/static/js/util.js" integrity="sha384-8vf+Et4kAE1vlYnPu6eqdHc87s/gPaMgEbQs6hTCrAoVrU/2+gwZsWn0PkQ+uzz9"></script>
<script src="/static/js/layout.js" integrity="sha384-YuqiK8ghvkemv2WE11QDtksZ8NuCwmK48ous0Fqt2+DdNIy6TJ2nu4YXLJGzij9B"></script>
<script src="/static/js/toast.js" integrity="sha384-rJf0ghcDDyTSRWuJBh0oIWI5018WpskKKJWc467cQKtx4Ol3ldIt8aL4iZXE6DTG"></script>
<script src="/static/js/tooltip.js" integrity="sha384-FBe2v4AX/7O72bIXLhFw5BYfgyVliL0EXpnX2tj3gLPqle3aykCG8TnNAgPnRzk3"></script>
<script src="/static/js/password-strength.js" integrity="sha384-IeP95lC7n09ihVrLVJYgmB4sIYrGSfMMPb5xIsvhZhnmFo4cZZxWkMY5wi/XyBQ+"></script>
<script src="/static/js/page-register.js" integrity="sha384-Ke2NiS3Kbjx0ypaYWXEk7R2Gf52NHlmpdAgNsH0wceTPZoIYxMHCkB1Ws9CTLDTe"></script>
</body>
</html>
