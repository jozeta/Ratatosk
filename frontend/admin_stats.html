<!doctype html>
<html lang="en" data-accent="slate-steel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratatosk - Statistics</title>
<link rel="stylesheet" href="/static/css/app.css" integrity="sha384-I2rr+j/Gv8h35d4eBmpOKp3qq/jpJhC0zMpqZo72CUFYoGEhojmhPOlm/gOTdymV">
<link rel="stylesheet" href="/static/vendor/lada-glass/2.0.0/lada-glass.css" integrity="sha384-Pcy+AL+UIHoOzAbu5A/K00s/QTNk2VSG5bDNEB8m31e9QDI2Vg6XBEvyaDY+0Pmi">
<link rel="stylesheet" href="/static/css/lada.css" integrity="sha384-St7wAdv0KVPHd4/ZVpN3+ncG94xLGgmte4D5waNGc6Pagj0UKLt9ubojieexwAQE">
</head>
<body>

<div id="sd-navbar" class="navbar"></div>

<main class="container-wide" style="padding-top:32px; padding-bottom:32px">
  <h2 class="mt-0">Statistics</h2>

  <div class="grid grid-2 mb-2" id="statCards"></div>

  <div class="card">
    <div class="card-header">
      <h3 class="mt-0 mb-0">Activity over time</h3>
      <select id="rangeSelect" style="width:auto">
        <option value="7d">Last 7 days</option>
        <option value="30d" selected>Last 30 days</option>
        <option value="6m">Last 6 months</option>
        <option value="1y">Last 1 year</option>
      </select>
    </div>
    <div class="chart-legend mb-1">
      <span class="legend-item"><span class="legend-swatch" style="background:#3457d5"></span>Uploads</span>
      <span class="legend-item"><span class="legend-swatch" style="background:#37c789"></span>Downloads</span>
    </div>
    <div class="bar-chart-scroll">
      <svg id="activityChart" width="100%" height="240"></svg>
    </div>
  </div>

  <div class="grid grid-2">
    <div class="card mb-0">
      <h3 class="mt-0">Storage usage</h3>
      <div class="row" style="align-items:center">
        <div style="flex:none">
          <svg id="storagePie" width="180" height="180" viewBox="0 0 200 200"></svg>
        </div>
        <div style="flex:1; min-width:180px">
          <div id="storageLegend"></div>
          <p class="small text-muted mt-2" id="storageText"></p>
        </div>
      </div>
    </div>

    <div class="card mb-0">
      <h3 class="mt-0">File extensions</h3>
      <div class="row" style="align-items:center">
        <div style="flex:none">
          <svg id="extensionPie" width="180" height="180" viewBox="0 0 200 200"></svg>
        </div>
        <div style="flex:1; min-width:180px">
          <div id="extensionLegend"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt-2">
    <h3 class="mt-0">Event totals (all-time)</h3>
    <div class="table-wrap">
      <table>
        <tbody id="eventsTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<footer class="app-footer" id="sd-footer"></footer>

<script src="/static/js/theme.js" integrity="sha384-nHvWqFZ1BnneONoX6ZPhrl4VABFF8xIUWBwbhH3cUOnUSiE3adAxGv7hWS2t52O0"></script>
<script src="/static/js/api.js" integrity="sha384-Y9cUFpIQmvkj2Dod0H9JG7V5GxpTGFAbTZhJLHozPr7aj5lVBXYv/vTl5aw/Wecd"></script>
<script src="/static/js/util.js" integrity="sha384-8vf+Et4kAE1vlYnPu6eqdHc87s/gPaMgEbQs6hTCrAoVrU/2+gwZsWn0PkQ+uzz9"></script>
<script src="/static/js/layout.js" integrity="sha384-YuqiK8ghvkemv2WE11QDtksZ8NuCwmK48ous0Fqt2+DdNIy6TJ2nu4YXLJGzij9B"></script>
<script src="/static/js/toast.js" integrity="sha384-rJf0ghcDDyTSRWuJBh0oIWI5018WpskKKJWc467cQKtx4Ol3ldIt8aL4iZXE6DTG"></script>
<script src="/static/js/admin-stats.js" integrity="sha384-5ueN5a2R0Vwcbl4E3mCQEGc0aB64tDo0MLOxI2Hv+gUNGMLFUlftDTK6mi3H6JCC"></script>
</body>
</html>
