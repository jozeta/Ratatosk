<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureDrop - Reset Password</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div id="sd-navbar" class="navbar"></div>

<main class="container-narrow" style="padding-top:32px; padding-bottom:32px">
  <div class="card" style="max-width:400px; margin:0 auto">
    <h2 class="mt-0">Reset password</h2>

    <div class="alert alert-danger" id="noTokenNotice" hidden>This link is missing its reset token. Request a new one from the <a href="/forgot-password">forgot password</a> page.</div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required autocomplete="new-password">
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <span class="small text-muted" id="strengthLabel"></span>
        <ul class="policy-checklist" id="policyChecklist"></ul>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset password</button>
    </form>

    <div class="alert alert-success mt-2" id="doneNotice" hidden>Your password has been reset. <a href="/login">Log in</a> with your new password.</div>
  </div>
</main>

<footer class="app-footer" id="sd-footer"></footer>

<script src="/static/js/theme.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/layout.js"></script>
<script src="/static/js/toast.js"></script>
<script src="/static/js/password-strength.js"></script>
<script>
(function () {
  const token = new URLSearchParams(window.location.search).get("token");
  const form = document.getElementById("resetForm");
  const submitBtn = document.getElementById("submitBtn");
  const doneNotice = document.getElementById("doneNotice");

  if (!token) {
    document.getElementById("noTokenNotice").hidden = false;
    form.hidden = true;
  }

  window.SDApi.get("/api/config").then((cfg) => {
    window.SDPasswordStrength.attach(
      document.getElementById("newPassword"),
      document.getElementById("strengthFill"),
      document.getElementById("strengthLabel"),
      document.getElementById("policyChecklist"),
      cfg
    );
  }).catch(() => {});

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    if (newPassword !== confirmPassword) {
      window.SDToast.danger("Passwords don't match.");
      return;
    }
    submitBtn.disabled = true;
    try {
      await window.SDApi.post("/api/auth/reset-password", { token, new_password: newPassword });
      form.hidden = true;
      doneNotice.hidden = false;
    } catch (err) {
      window.SDToast.danger(err.message);
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
