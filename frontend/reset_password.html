<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratatosk - Reset Password</title>
<link rel="stylesheet" href="/static/css/app.css" integrity="sha384-YetmR1azM/OlNBUGGGv1MKgZtyC1WcP/ovrT7LEul6zowoFeQF0lXLeo9qdpRg2x">
</head>
<body>

<div id="sd-navbar" class="navbar"></div>

<main class="container-narrow" style="padding-top:32px; padding-bottom:32px">
  <div class="card" style="max-width:400px; margin:0 auto">
    <h2 class="mt-0">Reset password</h2>

    <div class="alert alert-danger" id="noTokenNotice" hidden>This link is missing its reset token. Request a new one from the <a href="/forgot-password">forgot password</a> page.</div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required autocomplete="new-password">
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <span class="small text-muted" id="strengthLabel"></span>
        <ul class="policy-checklist" id="policyChecklist"></ul>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Reset password</button>
    </form>

    <div class="alert alert-success mt-2" id="doneNotice" hidden>Your password has been reset. <a href="/login">Log in</a> with your new password.</div>
  </div>
</main>

<footer class="app-footer" id="sd-footer"></footer>

<script src="/static/js/theme.js" integrity="sha384-nHvWqFZ1BnneONoX6ZPhrl4VABFF8xIUWBwbhH3cUOnUSiE3adAxGv7hWS2t52O0"></script>
<script src="/static/js/api.js" integrity="sha384-Y9cUFpIQmvkj2Dod0H9JG7V5GxpTGFAbTZhJLHozPr7aj5lVBXYv/vTl5aw/Wecd"></script>
<script src="/static/js/util.js" integrity="sha384-8vf+Et4kAE1vlYnPu6eqdHc87s/gPaMgEbQs6hTCrAoVrU/2+gwZsWn0PkQ+uzz9"></script>
<script src="/static/js/layout.js" integrity="sha384-YuqiK8ghvkemv2WE11QDtksZ8NuCwmK48ous0Fqt2+DdNIy6TJ2nu4YXLJGzij9B"></script>
<script src="/static/js/toast.js" integrity="sha384-rJf0ghcDDyTSRWuJBh0oIWI5018WpskKKJWc467cQKtx4Ol3ldIt8aL4iZXE6DTG"></script>
<script src="/static/js/password-strength.js" integrity="sha384-IeP95lC7n09ihVrLVJYgmB4sIYrGSfMMPb5xIsvhZhnmFo4cZZxWkMY5wi/XyBQ+"></script>
<script src="/static/js/page-reset-password.js" integrity="sha384-/im4ad014Triwoa+UVp/GMvlFaslHmKidkFRTZGGyvIho4o/wMhhrLoc5zyZsITP"></script>
</body>
</html>
