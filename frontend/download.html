<!doctype html>
<html lang="en" data-accent="slate-steel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratatosk - Manual Lookup</title>
<link rel="stylesheet" href="/static/css/app.css" integrity="sha384-YetmR1azM/OlNBUGGGv1MKgZtyC1WcP/ovrT7LEul6zowoFeQF0lXLeo9qdpRg2x">
<link rel="stylesheet" href="/static/vendor/lada-glass/1.1.0/lada-glass.css" integrity="sha384-F9z2HVYMp/rZQizpuzs26hcCLsceneof0ipKZKBRX5Vocywh3SRfkEelQNYwgFvH">
<link rel="stylesheet" href="/static/css/lada.css" integrity="sha384-CdF0mzlZQ5/Ht70387qrB+k3/Vmz7RsH0agFwaYVl1lGoZmXgVHLHKIoMZZFMVge">
</head>
<body>

<div id="sd-navbar" class="navbar"></div>

<main class="container-narrow" style="padding-top:32px; padding-bottom:32px">

  <div class="card">
    <h2 class="mt-0">Manual file lookup</h2>
    <p class="text-muted small">Don't have a full link? Enter the File ID and its decryption key or passphrase.</p>

    <div class="form-group">
      <label for="fileIdInput">File ID<span class="info-icon" tabindex="0">i<span class="info-tooltip">The identifier from the share link, e.g. the part after /share/ and before the # in https://.../share/&lt;file_id&gt;#&lt;key&gt;.</span></span></label>
      <input type="text" id="fileIdInput" placeholder="e.g. 3f9c1a2b-...">
    </div>
    <div class="form-group">
      <label for="secretInput">Decryption key or passphrase<span class="info-icon" tabindex="0">i<span class="info-tooltip">If the link had a #key fragment, paste that here. If the uploader instead set a passphrase, enter that passphrase - the file itself tells us which kind it needs once you look it up.</span></span></label>
      <input type="text" id="secretInput" placeholder="Paste the key, or enter the passphrase">
    </div>

    <div id="metaInfo" class="small text-muted mb-2"></div>

    <div id="progressWrap" class="mt-2" style="display:none">
      <div class="progress"><div class="progress-bar" id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" style="width:0%"></div></div>
      <div class="small text-muted mt-1" id="progressLabel"></div>
    </div>

    <button class="btn btn-primary btn-block" id="lookupBtn">Decrypt &amp; Download</button>
    <div id="resultView" class="mt-2" hidden></div>
  </div>
</main>

<footer class="app-footer" id="sd-footer"></footer>

<script src="/static/js/theme.js" integrity="sha384-nHvWqFZ1BnneONoX6ZPhrl4VABFF8xIUWBwbhH3cUOnUSiE3adAxGv7hWS2t52O0"></script>
<script src="/static/js/api.js" integrity="sha384-Y9cUFpIQmvkj2Dod0H9JG7V5GxpTGFAbTZhJLHozPr7aj5lVBXYv/vTl5aw/Wecd"></script>
<script src="/static/js/util.js" integrity="sha384-8vf+Et4kAE1vlYnPu6eqdHc87s/gPaMgEbQs6hTCrAoVrU/2+gwZsWn0PkQ+uzz9"></script>
<script src="/static/js/layout.js" integrity="sha384-YuqiK8ghvkemv2WE11QDtksZ8NuCwmK48ous0Fqt2+DdNIy6TJ2nu4YXLJGzij9B"></script>
<script src="/static/js/toast.js" integrity="sha384-rJf0ghcDDyTSRWuJBh0oIWI5018WpskKKJWc467cQKtx4Ol3ldIt8aL4iZXE6DTG"></script>
<script src="/static/js/tooltip.js" integrity="sha384-FBe2v4AX/7O72bIXLhFw5BYfgyVliL0EXpnX2tj3gLPqle3aykCG8TnNAgPnRzk3"></script>
<script src="/static/js/crypto.js" integrity="sha384-qy4RDYMOZlvvba5s5iwbR00/PwcZSGFt2grCe8uARhlL9K0h4PF1lHbocoColpoA"></script>
<script src="/static/js/download-common.js" integrity="sha384-KrPKJhuZwQWfAmk08H0f+aBEqM4qYtZKjBb8xyv3AjMDT2o8UDvOHE1yo3e4RQdt"></script>
<script src="/static/js/download-portal.js" integrity="sha384-5uFCI8uXcmlRDf37nx5YkqqIvBpk3GnfXEdhCjYxm1X12+VMCACqiONWXzuqbKfl"></script>
</body>
</html>
