<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureDrop - My Files</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<div id="sd-navbar" class="navbar"></div>

<main class="container-wide" style="padding-top:32px; padding-bottom:32px">
  <div class="card">
    <div class="card-header">
      <h2 class="mt-0 mb-0">My Files</h2>
      <a href="/" class="btn btn-primary btn-sm">Upload new</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>File ID</th><th>Size</th><th>Uploaded</th><th>Expires</th><th>Downloads</th><th>Burn</th><th>Shared with</th><th></th></tr>
        </thead>
        <tbody id="filesTableBody"></tbody>
      </table>
    </div>
    <p class="text-muted small mt-2" id="emptyState" style="display:none">No active files.</p>
  </div>
</main>

<footer class="app-footer" id="sd-footer"></footer>

<script src="/static/js/theme.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/layout.js"></script>
<script src="/static/js/toast.js"></script>
<script src="/static/js/my-files.js"></script>
</body>
</html>
