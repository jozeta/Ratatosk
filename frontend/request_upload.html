<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ratatosk - Send Files</title>
<link rel="stylesheet" href="/static/css/app.css" integrity="sha384-YetmR1azM/OlNBUGGGv1MKgZtyC1WcP/ovrT7LEul6zowoFeQF0lXLeo9qdpRg2x">
</head>
<body>

<div id="sd-navbar" class="navbar"></div>

<main class="container-narrow" style="padding-top:32px; padding-bottom:32px">
  <div class="card">
    <h2 class="mt-0">Send files securely</h2>
    <p class="text-muted small" id="reqInfo">Loading…</p>
    <p class="small" id="reqLabel" hidden></p>

    <div id="reqClosed" class="resume-banner" hidden></div>

    <div id="sendPanel" hidden>
      <p class="small text-muted">
        Your files are encrypted in this browser so that only the person who sent you this link can open them -
        this server can't. You don't need an account.
      </p>
      <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Choose files to send">
        <div class="icon" aria-hidden="true">📁</div>
        <div>Drag &amp; drop files here, or click to browse</div>
        <div class="form-hint" id="maxSizeHint"></div>
        <input type="file" id="fileInput" multiple hidden>
      </div>
      <ul class="file-queue mt-2" id="sentList" aria-label="Files sent"></ul>
    </div>
  </div>
</main>

<footer class="app-footer" id="sd-footer"></footer>

<script src="/static/js/theme.js" integrity="sha384-nHvWqFZ1BnneONoX6ZPhrl4VABFF8xIUWBwbhH3cUOnUSiE3adAxGv7hWS2t52O0"></script>
<script src="/static/js/api.js" integrity="sha384-Y9cUFpIQmvkj2Dod0H9JG7V5GxpTGFAbTZhJLHozPr7aj5lVBXYv/vTl5aw/Wecd"></script>
<script src="/static/js/util.js" integrity="sha384-8vf+Et4kAE1vlYnPu6eqdHc87s/gPaMgEbQs6hTCrAoVrU/2+gwZsWn0PkQ+uzz9"></script>
<script src="/static/js/layout.js" integrity="sha384-YuqiK8ghvkemv2WE11QDtksZ8NuCwmK48ous0Fqt2+DdNIy6TJ2nu4YXLJGzij9B"></script>
<script src="/static/js/toast.js" integrity="sha384-rJf0ghcDDyTSRWuJBh0oIWI5018WpskKKJWc467cQKtx4Ol3ldIt8aL4iZXE6DTG"></script>
<script src="/static/js/crypto.js" integrity="sha384-qy4RDYMOZlvvba5s5iwbR00/PwcZSGFt2grCe8uARhlL9K0h4PF1lHbocoColpoA"></script>
<script src="/static/js/keys.js" integrity="sha384-Zd/0PIs7pfiL0dGKndmGQ3u7rwnbfEZycLzu/ByQPuFLuCEiOYdE+tUrus4G0e/w"></script>
<script src="/static/js/exif-strip.js" integrity="sha384-MF5xMOtLF+VF8UsOGugPmkOcwQDj7L2lXJ6DQO5EV9OiHglA1uTudd0MLW1nPeou"></script>
<script src="/static/js/upload-engine.js" integrity="sha384-emUHBncelUds5BpgFggrNqsQ7bcwdXhfjyc4vx/EPArykr6ByQjRH2bsNEpCbXKo"></script>
<script src="/static/js/page-request-upload.js" integrity="sha384-S+bcsfAfyYdNPxYtn+CX81jkrcRb1NgP4itKT+f7+0Cic1dgKTTSmKVlWCo/Womp"></script>
</body>
</html>
