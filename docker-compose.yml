services:
  ratatosk:
    build: .
    ports:
      - "8000:8000"
    environment:
      RATATOSK_DATABASE_URL: "sqlite:////app/data/ratatosk.db"
      RATATOSK_STORAGE_ROOT: "/app/storage/encrypted"
      RATATOSK_TMP_ROOT: "/app/storage/tmp"
      RATATOSK_BRANDING_ROOT: "/app/storage/branding"
      RATATOSK_SECRET_KEY: "${RATATOSK_SECRET_KEY:?set a random 32+ char secret in .env}"
      RATATOSK_DEFAULT_ADMIN_USERNAME: "${RATATOSK_DEFAULT_ADMIN_USERNAME:-admin}"
      RATATOSK_DEFAULT_ADMIN_PASSWORD: "${RATATOSK_DEFAULT_ADMIN_PASSWORD:-}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped

  # Optional: also publish Ratatosk as a Tor onion service (FEAT-009).
  #   docker compose --profile tor up -d
  #   docker compose exec tor cat /var/lib/tor/ratatosk/hostname
  # Then put that address in Admin Settings -> Tor onion address. See docs/TOR.md.
  tor:
    profiles: ["tor"]
    build: ./deploy/tor
    depends_on: [ratatosk]
    volumes:
      - tor-keys:/var/lib/tor/ratatosk
    restart: unless-stopped

volumes:
  tor-keys:
